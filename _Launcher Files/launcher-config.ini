# LET IT DIE Custom Launcher v2.3
# ES: No encierres las rutas entre comillas.
# EN: Do not put quotation marks around paths.

# ES: Carpeta de guardado del juego. EN: Game save folder.
SOURCE=%PROGRAMFILES(X86)%\Steam\steamapps\common\LET IT DIE\Savedata

# ES: Backup local verificado. EN: Verified local backup.
LOCAL_DEST=%USERPROFILE%\Documents\LETITDIE_Backups

# ES: El configurador de Drive rellena esta ruta.
# EN: The Drive configurator fills in this path.
DRIVE_ENABLED=0
DRIVE_DEST=

# Steam and game.
STEAM_EXE=%PROGRAMFILES(X86)%\Steam\steam.exe
APPID=794600
GAME_EXE=BrgGame-Steam.exe
LAUNCH_ARGUMENTS=-windowed

# ES: Espera al cerrar e intervalo de historicos. EN: Exit delay and history interval.
FLUSH_WAIT_SECONDS=15
HISTORIC_EVERY_DAYS=1

# ES: Borderless sin vigilancia continua. EN: Borderless without continuous locking.
BORDERLESS_ENABLED=1
FORCE_WINDOWED=1
# Request the monitor native resolution from the game engine.
FORCE_NATIVE_RESOLUTION=1
# manual = press Ctrl+Alt+F11 after the main menu loads (recommended).
# once = apply automatically once after the configured delay.
# lock = old continuous lock; may cause flicker and is not recommended.
BORDERLESS_MODE=manual
BORDERLESS_DELAY_SECONDS=20
# Hotkey and process polling interval.
BORDERLESS_POLL_MS=100
# Used only with BORDERLESS_MODE=lock.
BORDERLESS_LOCK_MS=8

# 0 = normal and recommended. 1 = keep the game always on top.
BORDERLESS_TOPMOST=0

# Empty = automatically detect the graphics configuration from SOURCE.
GRAPHICS_CONFIG=
